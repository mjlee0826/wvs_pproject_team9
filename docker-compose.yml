services:
  postgres:
    image: postgres:16-alpine
    container_name: wvs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wvs
      POSTGRES_PASSWORD: wvs_secret
      POSTGRES_DB: wvspocket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
